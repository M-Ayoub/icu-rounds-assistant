<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICU Patient Tracker &amp; SBAR Handover</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --primary: #0f4c81;
      --primary-hover: #0a355c;
      --primary-light: #e0f2fe;
      --accent: #0d9488;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    header {
      background: var(--primary);
      color: #ffffff;
      padding: 16px 24px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .container {
      max-width: 1440px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-alt);
    }

    .btn-light {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-light:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .btn-danger {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-accent:hover {
      opacity: 0.92;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .patient-item {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--surface-alt);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .patient-item.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .patient-item-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      background: #ffffff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(15, 76, 129, 0.14);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .parser-box {
      background: #f8fafc;
      border: 1px dashed #64748b;
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
    }

    .med-category-box {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 12px;
      background: var(--surface-alt);
      margin-bottom: 12px;
    }

    .med-category-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .med-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1.2fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .med-row-anticoag {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .med-row-other {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .med-row, .med-row-anticoag, .med-row-other {
        grid-template-columns: 1fr;
      }
    }

    .sbar-output {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .sbar-line {
      margin-bottom: 6px;
      font-size: 0.92rem;
    }

    .sbar-label {
      font-weight: 700;
      color: var(--primary);
    }

    .sbar-sub-heading {
      font-weight: 700;
      color: var(--text);
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .plan-segment {
      border-left: 4px solid var(--accent);
      background: #f0fdfa;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .plan-segment-title {
      font-weight: 700;
      color: #0f766e;
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .section-divider {
      border: 0;
      border-top: 1px solid var(--border-light);
      margin: 12px 0;
    }

    .deleted-panel {
      display: none;
    }

    .deleted-panel.open {
      display: block;
    }

    .deleted-item {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fffbeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.86rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>ICU Patient Tracker &amp; SBAR Handover</h1>
    <div class="header-actions">
      <button class="btn-light btn-sm" type="button" onclick="createNewPatient()">+ New Patient</button>
      <button class="btn-light btn-sm" type="button" onclick="toggleDeletedPanel()">
        Recently Deleted (<span id="deletedCount">0</span>)
      </button>
      <button class="btn-light btn-sm" type="button" onclick="copySbarText()">Copy SBAR</button>
    </div>
  </header>

  <div class="container">
    <aside>
      <div class="card">
        <div class="card-title">
          <span>Active ICU Beds</span>
          <span class="badge" id="activeCount">0</span>
        </div>
        <div id="patientList" class="patient-list"></div>
      </div>

      <div id="deletedPanel" class="card deleted-panel">
        <div class="card-title">
          <span>Recently Deleted</span>
          <button class="btn-danger btn-sm" type="button" onclick="bulkDeletePermanent()">Clear All</button>
        </div>
        <div id="deletedList"></div>
      </div>
    </aside>

    <main>
      <div class="card">
        <div class="card-title">
          <span>Quick Text-to-Form Parser</span>
          <button class="btn-accent btn-sm" type="button" onclick="parseRawTextToForm()">Parse Into Fields</button>
        </div>
        <div class="parser-box">
          <label for="rawParserInput">Paste raw admission note, handover text, or structured clinical summary</label>
          <textarea id="rawParserInput" placeholder="Example:
Bed: ICU-04 | Name: Ahmed Hassan | Age: 58 | Gender: Male | DOA: 2026-11-24
PMH: HTN, DM2
Diagnosis: Severe CAP with septic shock
HPI: 4-day history of fever, cough, dyspnea; intubated on admission.
Events: Required norepinephrine escalation; transient AFib converted with amiodarone.
Exam & Vitals: BP 108/64 (NE 0.12 mcg/kg/min), HR 96, RR 20 (VC-CMV), Temp 37.8C, SpO2 95%. Chest: bilateral crackles.
ABG: pH 7.38, PaCO2 42, PaO2 88, HCO3 24.5, Lactate 1.4.
Radiology: CXR shows right lower and middle lobe consolidation.
Labs: WBC 16.4, Hb 11.2, Plt 185, Cr 1.3, Urea 48, CRP 145."></textarea>
        </div>

        <div class="card-title">
          <span>Patient &amp; Clinical Data Form</span>
          <div style="display:flex;gap:8px;">
            <button class="btn-secondary btn-sm" type="button" onclick="clearForm()">Reset Fields</button>
            <button class="btn-primary btn-sm" type="button" onclick="saveCurrentPatient()">Save Patient</button>
          </div>
        </div>

        <div class="grid-3">
          <div class="field">
            <label for="bedNumber">Bed Number</label>
            <input type="text" id="bedNumber" placeholder="e.g. Bed 01 / ICU-1" oninput="renderSbar()" />
          </div>
          <div class="field">
            <label for="patientName">Patient Name</label>
            <input type="text" id="patientName" placeholder="Full name" oninput="renderSbar()" />
          </div>
          <div class="field">
            <label for="age">Age</label>
            <input type="text" id="age" placeholder="e.g. 62y" oninput="renderSbar()" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" onchange="renderSbar()">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="field">
            <label for="dateOfAdmission">Date of Admission</label>
            <input type="date" id="dateOfAdmission" onchange="renderSbar()" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="pastHistory">Past History</label>
            <textarea id="pastHistory" placeholder="Comorbidities, past surgeries, allergies..." oninput="renderSbar()"></textarea>
          </div>
          <div class="field">
            <label for="diagnosis">Diagnosis</label>
            <textarea id="diagnosis" placeholder="Primary & secondary ICU diagnoses" oninput="renderSbar()"></textarea>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="historyOfIllness">History of Illness</label>
            <textarea id="historyOfIllness" placeholder="Presenting illness course..." oninput="renderSbar()"></textarea>
          </div>
          <div class="field">
            <label for="events">Events</label>
            <textarea id="events" placeholder="Key ICU events, procedures, complications..." oninput="renderSbar()"></textarea>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="examAndVitals">Examination &amp; Vital Signs</label>
            <textarea id="examAndVitals" placeholder="Vitals, GCS/sedation, cardiovascular, chest, abdomen, neuro..." oninput="renderSbar()"></textarea>
          </div>
          <div class="field">
            <label for="abg">ABG</label>
            <textarea id="abg" placeholder="pH, pCO2, pO2, HCO3, Lactate, base excess..." oninput="renderSbar()"></textarea>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="radiology">Radiology</label>
            <textarea id="radiology" placeholder="CXR, CT, POCUS findings..." oninput="renderSbar()"></textarea>
          </div>
          <div class="field">
            <label for="labs">Labs</label>
            <textarea id="labs" placeholder="CBC, KFT, LFT, electrolytes, inflammatory markers, cultures..." oninput="renderSbar()"></textarea>
          </div>
        </div>

        <div class="med-category-box">
          <div class="med-category-title">1. Antibiotics (Name, Start Date, Dose, Cause)</div>
          <div id="antibioticsContainer"></div>
          <button class="btn-secondary btn-sm" type="button" onclick="addAntibioticRow()">+ Add Antibiotic</button>
        </div>

        <div class="med-category-box">
          <div class="med-category-title">2. Anticoagulation (Agent / Dose, Start Date)</div>
          <div id="anticoagContainer"></div>
          <button class="btn-secondary btn-sm" type="button" onclick="addAnticoagRow()">+ Add Anticoagulation</button>
        </div>

        <div class="med-category-box">
          <div class="med-category-title">3. Remaining Medications</div>
          <div id="otherMedsContainer"></div>
          <button class="btn-secondary btn-sm" type="button" onclick="addOtherMedRow()">+ Add Medication</button>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="planDiagnostics">Plan — Diagnostics &amp; Monitoring</label>
            <textarea id="planDiagnostics" placeholder="Follow-up labs, imaging, cultures, monitoring targets..." oninput="renderSbar()"></textarea>
          </div>
          <div class="field">
            <label for="planTherapeutics">Plan — Therapeutics, Organ Support &amp; Disposition</label>
            <textarea id="planTherapeutics" placeholder="Ventilator/hemodynamic/med changes, consults, family/code status..." oninput="renderSbar()"></textarea>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Standardized SBAR Handover Summary</span>
          <button class="btn-primary btn-sm" type="button" onclick="copySbarText()">Copy Formatted SBAR</button>
        </div>
        <div id="sbarPreview" class="sbar-output"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "icu_sbar_patients_v1";
    const DELETED_KEY = "icu_sbar_deleted_v1";

    let patients = [];
    let deletedItems = [];
    let activePatientId = null;

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function loadStorage() {
      try {
        patients = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        deletedItems = JSON.parse(localStorage.getItem(DELETED_KEY) || "[]");
      } catch (e) {
        patients = [];
        deletedItems = [];
      }
      if (patients.length > 0 && !activePatientId) {
        activePatientId = patients[0].id;
        loadPatientIntoForm(patients[0]);
      } else {
        ensureDefaultMedRows();
      }
      renderSidebar();
      renderDeletedList();
      renderSbar();
    }

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
      localStorage.setItem(DELETED_KEY, JSON.stringify(deletedItems));
    }

    function ensureDefaultMedRows() {
      if (!document.getElementById("antibioticsContainer").children.length) addAntibioticRow();
      if (!document.getElementById("anticoagContainer").children.length) addAnticoagRow();
      if (!document.getElementById("otherMedsContainer").children.length) addOtherMedRow();
    }

    function addAntibioticRow(data = {}) {
      const container = document.getElementById("antibioticsContainer");
      const row = document.createElement("div");
      row.className = "med-row";
      row.innerHTML = `
        <input type="text" class="abx-name" placeholder="Antibiotic name" value="${escapeAttr(data.name || "")}" oninput="renderSbar()" />
        <input type="date" class="abx-start" value="${escapeAttr(data.startDate || "")}" onchange="renderSbar()" />
        <input type="text" class="abx-dose" placeholder="Dose & frequency" value="${escapeAttr(data.dose || "")}" oninput="renderSbar()" />
        <input type="text" class="abx-cause" placeholder="Indication / cause" value="${escapeAttr(data.cause || "")}" oninput="renderSbar()" />
        <button class="btn-danger btn-sm" type="button" onclick="this.parentElement.remove(); renderSbar();">Remove</button>
      `;
      container.appendChild(row);
      renderSbar();
    }

    function addAnticoagRow(data = {}) {
      const container = document.getElementById("anticoagContainer");
      const row = document.createElement("div");
      row.className = "med-row-anticoag";
      row.innerHTML = `
        <input type="text" class="ac-agent" placeholder="Anticoagulant & dose (e.g. Enoxaparin 40mg SC daily)" value="${escapeAttr(data.agent || "")}" oninput="renderSbar()" />
        <input type="date" class="ac-start" value="${escapeAttr(data.startDate || "")}" onchange="renderSbar()" />
        <button class="btn-danger btn-sm" type="button" onclick="this.parentElement.remove(); renderSbar();">Remove</button>
      `;
      container.appendChild(row);
      renderSbar();
    }

    function addOtherMedRow(data = {}) {
      const container = document.getElementById("otherMedsContainer");
      const row = document.createElement("div");
      row.className = "med-row-other";
      row.innerHTML = `
        <input type="text" class="other-med" placeholder="Medication, dose & route" value="${escapeAttr(data.med || "")}" oninput="renderSbar()" />
        <input type="text" class="other-note" placeholder="Optional note / timing" value="${escapeAttr(data.note || "")}" oninput="renderSbar()" />
        <button class="btn-danger btn-sm" type="button" onclick="this.parentElement.remove(); renderSbar();">Remove</button>
      `;
      container.appendChild(row);
      renderSbar();
    }

    function collectMedsFromForm() {
      const antibiotics = Array.from(document.querySelectorAll("#antibioticsContainer .med-row"))
        .map(r => ({
          name: r.querySelector(".abx-name").value.trim(),
          startDate: r.querySelector(".abx-start").value.trim(),
          dose: r.querySelector(".abx-dose").value.trim(),
          cause: r.querySelector(".abx-cause").value.trim()
        }))
        .filter(x => x.name || x.startDate || x.dose || x.cause);

      const anticoagulation = Array.from(document.querySelectorAll("#anticoagContainer .med-row-anticoag"))
        .map(r => ({
          agent: r.querySelector(".ac-agent").value.trim(),
          startDate: r.querySelector(".ac-start").value.trim()
        }))
        .filter(x => x.agent || x.startDate);

      const remaining = Array.from(document.querySelectorAll("#otherMedsContainer .med-row-other"))
        .map(r => ({
          med: r.querySelector(".other-med").value.trim(),
          note: r.querySelector(".other-note").value.trim()
        }))
        .filter(x => x.med || x.note);

      return { antibiotics, anticoagulation, remaining };
    }

    function collectFormData() {
      return {
        id: activePatientId || ("pt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6)),
        bedNumber: document.getElementById("bedNumber").value.trim(),
        patientName: document.getElementById("patientName").value.trim(),
        age: document.getElementById("age").value.trim(),
        gender: document.getElementById("gender").value.trim(),
        dateOfAdmission: document.getElementById("dateOfAdmission").value.trim(),
        pastHistory: document.getElementById("pastHistory").value.trim(),
        diagnosis: document.getElementById("diagnosis").value.trim(),
        historyOfIllness: document.getElementById("historyOfIllness").value.trim(),
        events: document.getElementById("events").value.trim(),
        examAndVitals: document.getElementById("examAndVitals").value.trim(),
        abg: document.getElementById("abg").value.trim(),
        radiology: document.getElementById("radiology").value.trim(),
        labs: document.getElementById("labs").value.trim(),
        medications: collectMedsFromForm(),
        planDiagnostics: document.getElementById("planDiagnostics").value.trim(),
        planTherapeutics: document.getElementById("planTherapeutics").value.trim(),
        updatedAt: new Date().toISOString()
      };
    }

    function clearForm() {
      activePatientId = null;
      [
        "bedNumber", "patientName", "age", "gender", "dateOfAdmission",
        "pastHistory", "diagnosis", "historyOfIllness", "events",
        "examAndVitals", "abg", "radiology", "labs",
        "planDiagnostics", "planTherapeutics"
      ].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      document.getElementById("antibioticsContainer").innerHTML = "";
      document.getElementById("anticoagContainer").innerHTML = "";
      document.getElementById("otherMedsContainer").innerHTML = "";
      ensureDefaultMedRows();
      renderSidebar();
      renderSbar();
    }

    function createNewPatient() {
      clearForm();
      document.getElementById("bedNumber").focus();
      showToast("Ready for new patient entry");
    }

    function loadPatientIntoForm(pt) {
      activePatientId = pt.id;
      document.getElementById("bedNumber").value = pt.bedNumber || "";
      document.getElementById("patientName").value = pt.patientName || "";
      document.getElementById("age").value = pt.age || "";
      document.getElementById("gender").value = pt.gender || "";
      document.getElementById("dateOfAdmission").value = pt.dateOfAdmission || "";
      document.getElementById("pastHistory").value = pt.pastHistory || "";
      document.getElementById("diagnosis").value = pt.diagnosis || "";
      document.getElementById("historyOfIllness").value = pt.historyOfIllness || "";
      document.getElementById("events").value = pt.events || "";
      document.getElementById("examAndVitals").value = pt.examAndVitals || "";
      document.getElementById("abg").value = pt.abg || "";
      document.getElementById("radiology").value = pt.radiology || "";
      document.getElementById("labs").value = pt.labs || "";
      document.getElementById("planDiagnostics").value = pt.planDiagnostics || "";
      document.getElementById("planTherapeutics").value = pt.planTherapeutics || "";

      const abxBox = document.getElementById("antibioticsContainer");
      const acBox = document.getElementById("anticoagContainer");
      const otherBox = document.getElementById("otherMedsContainer");
      abxBox.innerHTML = "";
      acBox.innerHTML = "";
      otherBox.innerHTML = "";

      const meds = pt.medications || {};
      (meds.antibiotics || []).forEach(addAntibioticRow);
      (meds.anticoagulation || []).forEach(addAnticoagRow);
      (meds.remaining || []).forEach(addOtherMedRow);
      ensureDefaultMedRows();

      renderSidebar();
      renderSbar();
    }

    function saveCurrentPatient() {
      const data = collectFormData();
      if (!data.bedNumber && !data.patientName && !data.diagnosis) {
        showToast("Enter at least a bed number, name, or diagnosis");
        return;
      }
      const idx = patients.findIndex(p => p.id === data.id);
      if (idx >= 0) {
        patients[idx] = data;
      } else {
        patients.unshift(data);
      }
      activePatientId = data.id;
      saveStorage();
      renderSidebar();
      renderSbar();
      showToast("Patient saved");
    }

    function softDeletePatient(id, event) {
      if (event) event.stopPropagation();
      const idx = patients.findIndex(p => p.id === id);
      if (idx < 0) return;
      const [removed] = patients.splice(idx, 1);
      removed.deletedAt = new Date().toISOString();
      deletedItems.unshift(removed);

      if (activePatientId === id) {
        if (patients.length > 0) {
          loadPatientIntoForm(patients[0]);
        } else {
          clearForm();
        }
      }
      saveStorage();
      renderSidebar();
      renderDeletedList();
      showToast("Moved to Recently Deleted");
    }

    function restoreDeletedItem(id) {
      const idx = deletedItems.findIndex(d => d.id === id);
      if (idx < 0) return;
      const [restored] = deletedItems.splice(idx, 1);
      delete restored.deletedAt;
      patients.unshift(restored);
      activePatientId = restored.id;
      loadPatientIntoForm(restored);
      saveStorage();
      renderSidebar();
      renderDeletedList();
      showToast("Patient restored");
    }

    function permanentDeleteItem(id) {
      deletedItems = deletedItems.filter(d => d.id !== id);
      saveStorage();
      renderDeletedList();
      showToast("Permanently removed");
    }

    function bulkDeletePermanent() {
      if (!deletedItems.length) return;
      deletedItems = [];
      saveStorage();
      renderDeletedList();
      showToast("All recently deleted items removed");
    }

    function toggleDeletedPanel() {
      document.getElementById("deletedPanel").classList.toggle("open");
    }

    function renderSidebar() {
      const list = document.getElementById("patientList");
      document.getElementById("activeCount").textContent = String(patients.length);
      if (!patients.length) {
        list.innerHTML = `<div class="empty-state">No active patients saved yet.</div>`;
        return;
      }
      list.innerHTML = patients.map(p => {
        const isActive = p.id === activePatientId ? "active" : "";
        const title = [p.bedNumber || "No Bed", p.patientName || "Unnamed"].join(" — ");
        const sub = [p.age, p.gender, p.diagnosis].filter(Boolean).join(" • ") || "No summary";
        return `
          <div class="patient-item ${isActive}" onclick="selectPatient('${p.id}')">
            <div>
              <div style="font-weight:700;font-size:0.88rem;">${escapeHtml(title)}</div>
              <div class="patient-item-meta">${escapeHtml(sub)}</div>
            </div>
            <button class="btn-danger btn-sm" type="button" onclick="softDeletePatient('${p.id}', event)">Delete</button>
          </div>
        `;
      }).join("");
    }

    function selectPatient(id) {
      const found = patients.find(p => p.id === id);
      if (found) loadPatientIntoForm(found);
    }

    function renderDeletedList() {
      const list = document.getElementById("deletedList");
      document.getElementById("deletedCount").textContent = String(deletedItems.length);
      if (!deletedItems.length) {
        list.innerHTML = `<div class="empty-state">No recently deleted items.</div>`;
        return;
      }
      list.innerHTML = deletedItems.map(d => {
        const label = [d.bedNumber || "No Bed", d.patientName || "Unnamed"].join(" — ");
        return `
          <div class="deleted-item">
            <div>
              <div style="font-weight:700;font-size:0.84rem;">${escapeHtml(label)}</div>
              <div class="patient-item-meta">${escapeHtml(d.diagnosis || "No diagnosis")}</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn-secondary btn-sm" type="button" onclick="restoreDeletedItem('${d.id}')">Restore</button>
              <button class="btn-danger btn-sm" type="button" onclick="permanentDeleteItem('${d.id}')">Remove</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function extractLineValue(text, patterns) {
      for (const re of patterns) {
        const match = text.match(re);
        if (match && match[1]) return match[1].trim();
      }
      return "";
    }

    function parseRawTextToForm() {
      const raw = document.getElementById("rawParserInput").value.trim();
      if (!raw) {
        showToast("Paste clinical text first");
        return;
      }

      const bed = extractLineValue(raw, [
        /(?:bed(?:\s*(?:no|number|#))?|icu\s*bed)\s*[:\-]\s*([^\n|]+)/i,
        /\b(bed\s*\d+|icu-\d+)\b/i
      ]);
      const name = extractLineValue(raw, [
        /(?:patient\s*name|name|pt)\s*[:\-]\s*([^\n|]+)/i
      ]);
      const age = extractLineValue(raw, [
        /\bage\s*[:\-]\s*([^\n|]+)/i,
        /\b(\d{1,3}\s*(?:y\/?o|yrs?|years?))\b/i
      ]);
      const genderRaw = extractLineValue(raw, [
        /\b(?:gender|sex)\s*[:\-]\s*(male|female|m|f)\b/i,
        /\b(male|female)\b/i
      ]).toLowerCase();

      let gender = "";
      if (genderRaw === "male" || genderRaw === "m") gender = "Male";
      if (genderRaw === "female" || genderRaw === "f") gender = "Female";

      const doa = extractLineValue(raw, [
        /(?:doa|date\s*of\s*admission|admitted(?:\s*on)?)\s*[:\-]\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i
      ]);
      const pmh = extractLineValue(raw, [
        /(?:past\s*(?:medical\s*)?history|pmh|comorbidities)\s*[:\-]\s*([^\n]+)/i
      ]);
      const dx = extractLineValue(raw, [
        /(?:diagnosis|dx|impression)\s*[:\-]\s*([^\n]+)/i
      ]);
      const hpi = extractLineValue(raw, [
        /(?:history\s*of\s*(?:present\s*)?illness|hpi|presenting\s*history)\s*[:\-]\s*([^\n]+)/i
      ]);
      const events = extractLineValue(raw, [
        /(?:events?|icu\s*course|complications)\s*[:\-]\s*([^\n]+)/i
      ]);
      const exam = extractLineValue(raw, [
        /(?:examination\s*(?:and|&)\s*vital\s*signs|exam\s*(?:and|&)\s*vitals|vitals?\s*(?:and|&)\s*exam|examination|vitals)\s*[:\-]\s*([^\n]+)/i
      ]);
      const abg = extractLineValue(raw, [
        /\babg\b\s*[:\-]\s*([^\n]+)/i
      ]);
      const rad = extractLineValue(raw, [
        /(?:radiology|imaging|cxr|ct)\s*[:\-]\s*([^\n]+)/i
      ]);
      const labs = extractLineValue(raw, [
        /(?:labs?|investigations?|laboratory)\s*[:\-]\s*([^\n]+)/i
      ]);

      if (bed) document.getElementById("bedNumber").value = bed;
      if (name) document.getElementById("patientName").value = name;
      if (age) document.getElementById("age").value = age;
      if (gender) document.getElementById("gender").value = gender;
      if (doa && /^\d{4}-\d{2}-\d{2}$/.test(doa)) {
        document.getElementById("dateOfAdmission").value = doa;
      }
      if (pmh) document.getElementById("pastHistory").value = pmh;
      if (dx) document.getElementById("diagnosis").value = dx;
      if (hpi) document.getElementById("historyOfIllness").value = hpi;
      if (events) document.getElementById("events").value = events;
      if (exam) document.getElementById("examAndVitals").value = exam;
      if (abg) document.getElementById("abg").value = abg;
      if (rad) document.getElementById("radiology").value = rad;
      if (labs) document.getElementById("labs").value = labs;

      renderSbar();
      showToast("Parsed text into form fields");
    }

    function buildSbarData() {
      const d = collectFormData();
      const ageGender = [d.age, d.gender].filter(Boolean).join(", ");
      const examCombined = [
        d.examAndVitals,
        d.abg ? `ABG: ${d.abg}` : ""
      ].filter(Boolean).join(" | ");

      return { d, ageGender, examCombined };
    }

    function renderSbar() {
      const { d, ageGender, examCombined } = buildSbarData();
      const preview = document.getElementById("sbarPreview");

      const abxHtml = d.medications.antibiotics.length
        ? d.medications.antibiotics.map(a =>
            `<div class="sbar-line">• <strong>${escapeHtml(a.name || "Unspecified antibiotic")}</strong> — Dose: ${escapeHtml(a.dose || "N/A")} | Start: ${escapeHtml(a.startDate || "N/A")} | Cause: ${escapeHtml(a.cause || "N/A")}</div>`
          ).join("")
        : `<div class="sbar-line empty-state">None documented</div>`;

      const acHtml = d.medications.anticoagulation.length
        ? d.medications.anticoagulation.map(c =>
            `<div class="sbar-line">• <strong>${escapeHtml(c.agent || "Unspecified agent")}</strong> — Start: ${escapeHtml(c.startDate || "N/A")}</div>`
          ).join("")
        : `<div class="sbar-line empty-state">None documented</div>`;

      const otherHtml = d.medications.remaining.length
        ? d.medications.remaining.map(m =>
            `<div class="sbar-line">• <strong>${escapeHtml(m.med || "Medication")}</strong>${m.note ? ` — ${escapeHtml(m.note)}` : ""}</div>`
          ).join("")
        : `<div class="sbar-line empty-state">None documented</div>`;

      preview.innerHTML = `
        <div class="sbar-line"><span class="sbar-label">Bed Number:</span> ${escapeHtml(d.bedNumber || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Patient Name:</span> ${escapeHtml(d.patientName || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Age:</span> ${escapeHtml(ageGender || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Date of Admission:</span> ${escapeHtml(d.dateOfAdmission || "-")}</div>
        <hr class="section-divider" />
        <div class="sbar-line"><span class="sbar-label">Past History:</span> ${escapeHtml(d.pastHistory || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Diagnosis:</span> ${escapeHtml(d.diagnosis || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">History of Illness:</span> ${escapeHtml(d.historyOfIllness || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Events:</span> ${escapeHtml(d.events || "-")}</div>
        <hr class="section-divider" />
        <div class="sbar-line"><span class="sbar-label">Examination and Vital Signs:</span> ${escapeHtml(examCombined || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Radiology:</span> ${escapeHtml(d.radiology || "-")}</div>
        <div class="sbar-line"><span class="sbar-label">Labs:</span> ${escapeHtml(d.labs || "-")}</div>
        <hr class="section-divider" />
        <div class="sbar-line"><span class="sbar-label">Medications:</span></div>
        <div class="sbar-sub-heading">Antibiotics</div>
        ${abxHtml}
        <div class="sbar-sub-heading">Anticoagulation</div>
        ${acHtml}
        <div class="sbar-sub-heading">Remaining Medications</div>
        ${otherHtml}
        <hr class="section-divider" />
        <div class="plan-segment">
          <div class="plan-segment-title">Plan — Diagnostics &amp; Monitoring</div>
          <div>${escapeHtml(d.planDiagnostics || "-")}</div>
        </div>
        <div class="plan-segment">
          <div class="plan-segment-title">Plan — Therapeutics, Organ Support &amp; Disposition</div>
          <div>${escapeHtml(d.planTherapeutics || "-")}</div>
        </div>
      `;
    }

    function getPlainSbarText() {
      const { d, ageGender, examCombined } = buildSbarData();
      const lines = [
        `Bed Number: ${d.bedNumber || "-"}`,
        `Patient Name: ${d.patientName || "-"}`,
        `Age: ${ageGender || "-"}`,
        `Date of Admission: ${d.dateOfAdmission || "-"}`,
        `Past History: ${d.pastHistory || "-"}`,
        `Diagnosis: ${d.diagnosis || "-"}`,
        `History of Illness: ${d.historyOfIllness || "-"}`,
        `Events: ${d.events || "-"}`,
        `Examination and Vital Signs: ${examCombined || "-"}`,
        `Radiology: ${d.radiology || "-"}`,
        `Labs: ${d.labs || "-"}`,
        `Medications:`,
        `  Antibiotics:`,
        ...(d.medications.antibiotics.length
          ? d.medications.antibiotics.map(a => `    - ${a.name || "Unspecified"} | Dose: ${a.dose || "N/A"} | Start: ${a.startDate || "N/A"} | Cause: ${a.cause || "N/A"}`)
          : ["    - None"]),
        `  Anticoagulation:`,
        ...(d.medications.anticoagulation.length
          ? d.medications.anticoagulation.map(c => `    - ${c.agent || "Unspecified"} | Start: ${c.startDate || "N/A"}`)
          : ["    - None"]),
        `  Remaining Medications:`,
        ...(d.medications.remaining.length
          ? d.medications.remaining.map(m => `    - ${m.med || "Medication"}${m.note ? ` (${m.note})` : ""}`)
          : ["    - None"]),
        `--- Plan: Diagnostics & Monitoring ---`,
        d.planDiagnostics || "-",
        `--- Plan: Therapeutics, Organ Support & Disposition ---`,
        d.planTherapeutics || "-"
      ];
      return lines.join("\n");
    }

    function copySbarText() {
      const text = getPlainSbarText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("SBAR copied to clipboard")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("SBAR copied to clipboard");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    loadStorage();
  </script>
</body>
</html>
